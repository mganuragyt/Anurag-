<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Anurag Yadav</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        Arial,
        "Noto Sans Devanagari",
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 0%,
            #dbeafe,
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            #fce7f3,
            transparent 32%
        ),
        #f8fafc;

    color: #111827;
}

.header {
    text-align: center;
    padding: 28px 18px 24px;
    animation: headerIn .8s ease;
}

.profile {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid white;

    box-shadow:
        0 10px 30px rgba(0,0,0,.16);

    animation:
        floating 3s ease-in-out infinite;
}

.logo {
    margin-top: 12px;
    font-size: 30px;
    font-weight: 800;
}

.subtitle {
    margin-top: 5px;
    color: #64748b;
    font-size: 14px;
}

.instagram {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #833ab4,
            #fd1d1d,
            #fcb045
        );

    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;

    box-shadow:
        0 8px 22px
        rgba(253,29,29,.22);

    transition: .25s;
}

.instagram:hover {
    transform:
        translateY(-3px)
        scale(1.03);
}

.container {
    width: 100%;
    max-width: 720px;
    margin: auto;
    padding: 5px 14px 45px;
}

.section-title {
    font-size: 21px;
    font-weight: 800;
    margin: 10px 0 16px;
}

.news-card {
    overflow: hidden;
    background: white;
    border-radius: 22px;

    border:
        1px solid
        rgba(148,163,184,.2);

    box-shadow:
        0 18px 50px
        rgba(15,23,42,.12);

    animation:
        newsIn .7s ease;

    transition: .3s;
}

.news-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 24px 60px
        rgba(15,23,42,.16);
}

.news-image {
    width: 100%;
    height: 320px;
    display: block;
    object-fit: cover;

    background:
        linear-gradient(
            135deg,
            #dbeafe,
            #fce7f3
        );
}

.content {
    padding: 20px;
}

.badge {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 20px;

    background: #eef2ff;
    color: #4338ca;

    font-size: 11px;
    font-weight: 800;
}

.headline {
    font-size: 23px;
    line-height: 1.45;
    margin: 12px 0 10px;
    font-weight: 800;
}

.description {
    color: #475569;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 13px;
}

.source {
    color: #64748b;
    font-size: 12px;
    margin-bottom: 15px;
}

.read {
    display: inline-block;
    background: #111827;
    color: white;
    text-decoration: none;

    padding:
        11px 18px;

    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;

    transition: .25s;
}

.read:hover {
    transform: translateX(4px);
}

.loading {
    background: white;
    border-radius: 20px;
    padding: 45px 20px;
    text-align: center;
    color: #64748b;
}

footer {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    padding: 15px 20px 30px;
}

@keyframes headerIn {

    from {
        opacity: 0;
        transform: translateY(-25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes newsIn {

    from {
        opacity: 0;
        transform:
            translateY(25px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes floating {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}

@media (max-width:600px) {

    .news-image {
        height: 230px;
    }

    .headline {
        font-size: 20px;
    }
}

</style>

</head>

<body>

<header class="header">

    <img
        src="anurag.jpg"
        class="profile"
        alt="Anurag"
    >

    <div class="logo">
        Anurag Yadav
    </div>

    <div class="subtitle">
        आज की महत्वपूर्ण खबर
    </div>

    <a
        class="instagram"
        href="https://instagram.com/ydv._anurag"
        target="_blank"
        rel="noopener noreferrer"
    >
        Instagram
    </a>

</header>


<main class="container">

    <div class="section-title">
        🔥 आज की Trending News
    </div>

    <div id="news">

        <div class="loading">
            आज की खबर लोड हो रही है...
        </div>

    </div>

</main>


<footer>
    Made by Anurag Yadav
</footer>


<script>

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;
}


async function loadNews() {

    const box =
        document.getElementById("news");

    try {

        const response =
            await fetch(
                "news.json?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error();
        }

        const data =
            await response.json();

        const news =
            data.news || [];


        if (!news.length) {

            box.innerHTML = `
                <div class="loading">
                    📰 आज की खबरें
                    अभी update हो रही हैं।
                </div>
            `;

            return;
        }


        /*
        आज की news में से
        refresh पर अगली खबर।
        */

        const today =
            new Date()
            .toLocaleDateString(
                "en-CA"
            );

        const storageKey =
            "anurag-news-" + today;


        let index =
            parseInt(
                localStorage.getItem(
                    storageKey
                ),
                10
            );


        if (
            Number.isNaN(index) ||
            index < 0 ||
            index >= news.length
        ) {

            index = 0;

        } else {

            index =
                (index + 1)
                % news.length;
        }


        localStorage.setItem(
            storageKey,
            index
        );


        const item =
            news[index];


        box.innerHTML = `

            <article class="news-card">

                ${
                    item.image
                    ?
                    `
                    <img
                        class="news-image"
                        src="${item.image}"
                        alt="News"
                    >
                    `
                    :
                    `
                    <div
                        class="news-image"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:70px;
                        "
                    >
                        📰
                    </div>
                    `
                }

                <div class="content">

                    <span class="badge">
                        TODAY • TRENDING
                    </span>

                    <h1 class="headline">
                        ${escapeHTML(item.title)}
                    </h1>

                    ${
                        item.description
                        ?
                        `
                        <div class="description">
                            ${escapeHTML(
                                item.description
                            )}
                        </div>
                        `
                        :
                        ""
                    }

                    <div class="source">
                        Source:
                        ${escapeHTML(
                            item.source ||
                            "Trusted News"
                        )}
                    </div>

                    <a
                        class="read"
                        href="${item.link}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="read"
                    >
                        पूरी खबर पढ़ें →
                    </a>

                </div>

            </article>

        `;

    } catch {

        box.innerHTML = `
            <div class="loading">
                📰 आज की खबरें
                update हो रही हैं।
            </div>
        `;
    }
}


loadNews();

</script>

</body>
</html>
