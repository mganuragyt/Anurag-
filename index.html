<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anurag | Latest News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7f9;
      color: #171717;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
    }

    .top {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 24px 18px 20px;
      text-align: center;
    }

    .profile {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #111827;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .instagram {
      display: inline-block;
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 14px;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    .news-list {
      background: white;
      border-radius: 12px;
      padding: 5px 18px;
      border: 1px solid #e5e7eb;
    }

    .news-item {
      padding: 18px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .headline {
      font-size: 17px;
      line-height: 1.55;
      font-weight: 600;
      margin: 0 0 7px;
    }

    .description {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 8px;
    }

    .source {
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }

    .read {
      color: #155eef;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .english-section {
      margin-top: 38px;
    }

    .loading {
      color: #777;
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
    }

    .error {
      color: #b42318;
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header class="top">
    <img
      src="anurag.jpg"
      alt="Anurag"
      class="profile"
    >

    <h1>Anurag</h1>

    <div class="subtitle">
      Latest News • India & World
    </div>

    <a
      class="instagram"
      href="https://instagram.com/ydv._anurag"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>
  </header>


  <main class="container">

    <!-- HINDI NEWS -->
    <section>
      <h2 class="section-title">🇮🇳 आज की Latest News</h2>

      <div id="hindiNews" class="news-list">
        <div class="loading">
          Latest Hindi news लोड हो रही है...
        </div>
      </div>
    </section>


    <!-- ENGLISH NEWS -->
    <section class="english-section">
      <h2 class="section-title">🌍 Latest English News</h2>

      <div id="englishNews" class="news-list">
        <div class="loading">
          Latest English news लोड हो रही है...
        </div>
      </div>
    </section>

  </main>


  <footer>
    © 2026 Anurag
  </footer>


  <script>

    async function loadNews() {

      const hindiBox = document.getElementById("hindiNews");
      const englishBox = document.getElementById("englishNews");

      try {

        const response = await fetch(
          "news.json?time=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("News file not found");
        }

        const data = await response.json();

        showNews(
          hindiBox,
          data.hindi || [],
          "hi"
        );

        showNews(
          englishBox,
          data.english || [],
          "en"
        );

      } catch (error) {

        hindiBox.innerHTML =
          '<div class="error">अभी खबरें लोड नहीं हो सकीं। थोड़ी देर बाद फिर कोशिश करें।</div>';

        englishBox.innerHTML =
          '<div class="error">News could not be loaded right now.</div>';

      }

    }


    function showNews(box, news, language) {

      if (!news.length) {

        box.innerHTML =
          language === "hi"
            ? '<div class="loading">अभी कोई खबर उपलब्ध नहीं है।</div>'
            : '<div class="loading">No news available right now.</div>';

        return;
      }


      box.innerHTML = "";


      news.slice(0, 10).forEach(item => {

        const article = document.createElement("article");

        article.className = "news-item";


        const title = document.createElement("p");

        title.className = "headline";

        title.textContent = item.title || "";



        const description = document.createElement("p");

        description.className = "description";

        description.textContent =
          item.description || "";



        const source = document.createElement("div");

        source.className = "source";

        source.textContent =
          item.source
            ? "Source: " + item.source
            : "Trusted News Source";



        const link = document.createElement("a");

        link.className = "read";

        link.href = item.link || "#";

        link.target = "_blank";

        link.rel = "noopener noreferrer";

        link.textContent =
          language === "hi"
            ? "पूरी खबर पढ़ें →"
            : "Read full story →";



        article.appendChild(title);

        if (item.description) {
          article.appendChild(description);
        }

        article.appendChild(source);

        article.appendChild(link);


        box.appendChild(article);

      });

    }


    loadNews();

  </script>

</body>
</html>
